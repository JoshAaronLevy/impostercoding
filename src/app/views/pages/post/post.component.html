@if (post) {
  <app-hero [title]="post.title" />
  <div class="vl-blog-details-section sp-50">
    <div class="container">
      <div class="row">
        <div class="col-lg-10 m-auto">
          <div class="blog-others-sidebar">
            <div class="img1">
              <img [src]="post.featured_image" [alt]="post.title">
            </div>
            <div class="space32"></div>
            <ul class="list-author">
              <li class="list-item-date">
                <img src="assets/img/icons/calender1.svg" [alt]="post.updated"> {{ post.updated | date:
                  'MM/dd/yyyy' }}
              </li>
              <li *ngFor="let tag of post.tags">
                <a href="javascript:void(0)">{{ tag.name }}</a>
              </li>
            </ul>
            <div class="space20"></div>
            <div class="col-md-12" [innerHTML]="post.body"></div>
            <div class="space20"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
}
