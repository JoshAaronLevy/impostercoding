<div class="row">
  @for (post of posts(); track post.slug) {
    <div class="col-lg-6 col-md-6">
      <div class="blog-1-item">
        <a [routerLink]="['/', post.slug]">
          <div class="blog-1-thumb image-anime">
            <img [src]="post.featured_image">
          </div>
        </a>
        <div class="blog-1-content">
          <div class="blog-meta">
            <ul>
              @if (post.readingTime) {
                <li class="list-item-reading-time">
                  🕒 {{ post.readingTime }}
                </li>
              }
              <li>
                🗓️ {{ post.published ? (post.published | date: 'MM/dd/yy') : 'Date Unknown' }}
              </li>
            </ul>
          </div>
          <div class="space16"></div>
          <h4 class="blog-1-title">
            <a [routerLink]="['/', post.slug]">{{ post.title }}</a>
          </h4>
          <div class="space20"></div>
          <a [routerLink]="['/', post.slug]" class="readmore">
            Read More <i class="fa-solid fa-arrow-right"></i>
          </a>
        </div>
      </div>
    </div>
  }

  @if (moreAvailable()) {
    <div class="col-lg-12">
      <div class="space30"></div>
      <div class="text-center">
        <button (click)="loadMore()" class="btn btn-primary">Load More</button>
      </div>
    </div>
  }
</div>
